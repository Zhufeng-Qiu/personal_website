# The two labs, in tab order. The first is featured on the home page, the second mirrors
# it. /lab/quantization/ is a project lab outside this list, linked from its work row;
# /lab/packing/ and /lab/overlap/ now redirect to chapters of Lab 01.
labs:
  - id: compression
    number: "01"
    kicker: The trade-off
    title: When does compression pay?
    blurb: Same work. Different bottleneck. Explore recorded results, then try your own.
    url: /lab/compression/
    project: Multi-GPU Similarity Engine
    tab: Compression
  - id: kv
    number: "02"
    kicker: Moving LLM state
    title: Fewer bytes ≠ less time.
    blurb: One 3× smaller KV cache is slower between two GPUs and faster on a durable write. Same cache, same codec; the path sets the sign.
    url: /lab/kv-transfer/
    project: BoundRelay
    action: Race raw against compressed
    tab: KV transfer

